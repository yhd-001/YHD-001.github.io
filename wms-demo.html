<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生产部仓管系统</title>
<script src="xlsx.full.min.js"></script>
<script src="chart.umd.js"></script>
<style>
  :root{
    --bg:#eef2f7; --bg2:#ffffff; --bg3:#f1f5f9; --line:#e2e8f0;
    --txt:#1e293b; --txt2:#64748b;
    --accent:#5aa9e6; --accent2:#7dbdf0; --accent-ink:#0a3552;
    --green:#16a34a; --red:#dc2626; --orange:#ea580c; --gray:#94a3b8;
    --side1:#79bfe9; --side2:#a9d7f3;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:-apple-system,"Microsoft YaHei",Segoe UI,sans-serif; background:var(--bg); color:var(--txt); font-size:15.5px;}
  button{cursor:pointer; font-family:inherit;}
  input,select,textarea{font-family:inherit; font-size:15px; background:#fff; color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:10px 12px; outline:none;}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  .btn{background:var(--accent); color:var(--accent-ink); border:none; border-radius:6px; padding:10px 16px; font-size:14.5px; font-weight:600; transition:.15s;}
  .btn:hover{background:var(--accent2);}
  .btn.sub{background:#fff; color:var(--txt); border:1px solid var(--line);}
  .btn.sub:hover{border-color:var(--accent); color:#1a6aa0;}
  .btn.danger{background:#fee2e2; color:#b91c1c;}
  .btn.danger:hover{background:#fecaca;}
  .btn.green{background:#dcfce7; color:#15803d;}
  .btn.green:hover{background:#bbf7d0;}
  .btn.sm{padding:6px 11px; font-size:13px;}
  /* layout */
  #app{display:flex; min-height:100vh;}
  #sidebar{width:222px; background:linear-gradient(180deg,var(--side1),var(--side2)); border-right:1px solid #9fd0ef; flex-shrink:0; display:flex; flex-direction:column;}
  #sidebar .logo{padding:16px 16px 12px; border-bottom:1px solid rgba(255,255,255,.5);}
  .sidebar-logo{display:flex; align-items:center; gap:10px;}
  .sidebar-logo img{height:24px; max-width:70px; object-fit:contain; filter:brightness(0) opacity(.82);}
  .sidebar-logo span{font-size:14.5px; font-weight:700; letter-spacing:.3px; color:#0b3b5c; white-space:nowrap;}
  #sidebar .logo small{display:block; font-size:12px; color:#2a6288; margin-top:6px;}
  #sidebar .logo .ver{display:inline-block; font-size:11px; color:#0b3b5c; background:rgba(255,255,255,.45); border:1px solid rgba(255,255,255,.85); padding:1px 8px; border-radius:10px; margin-top:7px; letter-spacing:.5px;}
  #nav{padding:10px 8px; flex:1; overflow-y:auto;}
  .navitem{padding:12px 14px; border-radius:6px; color:#17456b; margin-bottom:3px; cursor:pointer; user-select:none; font-size:14.5px; display:flex; align-items:center; gap:10px; transition:.15s;}
  .navitem:hover{background:rgba(255,255,255,.55); color:#0b3b5c;}
  .navitem.active{background:#fff; color:#16689f; box-shadow:0 3px 12px rgba(20,60,100,.16);}
  .navitem .ic{width:18px; text-align:center; opacity:.9;}
  #sidebar .foot{padding:12px 16px; border-top:1px solid rgba(255,255,255,.5); font-size:13px; color:#245c86;}
  #main{flex:1; display:flex; flex-direction:column; min-width:0;}
  #topbar{padding:14px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; background:#fff;}
  #topbar h2{font-size:19px; font-weight:600;}
  #topbar .user{font-size:14px; color:var(--txt2); display:flex; align-items:center; gap:12px;}
  #content{padding:22px; overflow-y:auto; flex:1;}
  .card{background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:18px;}
  .card h3{font-size:17px; margin-bottom:14px; font-weight:600; display:flex; align-items:center; gap:8px;}
  .card h3::before{content:""; width:4px; height:17px; background:var(--accent); border-radius:3px; display:inline-block;}
  .grid-cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:18px;}
  .kpi{background:#fff; border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:10px; padding:18px 20px; cursor:pointer; transition:.15s;}
  .kpi:hover{border-color:var(--accent); transform:translateY(-2px);}
  .kpi .num{font-size:34px; font-weight:700; margin:4px 0; line-height:1.1;}
  .kpi .lbl{color:var(--txt2); font-size:14px;}
  .kpi.warn{border-left-color:var(--red); background:#fef2f2;}
  .kpi.warn .num{color:var(--red);}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:18px;}
  @media(max-width:1000px){ .grid-2{grid-template-columns:1fr;} }
  table{width:100%; border-collapse:collapse; font-size:14.5px;}
  th,td{padding:11px 12px; text-align:left; border-bottom:1px solid var(--line);}
  th{color:var(--txt2); font-weight:600; background:#f1f5f9; position:sticky; top:0;}
  tbody tr:hover{background:#f8fafc;}
  .tag{display:inline-block; padding:3px 10px; border-radius:20px; font-size:12.5px; background:#f1f5f9; color:var(--txt2);}
  .tag.red{background:#fee2e2; color:#dc2626;}
  .tag.green{background:#dcfce7; color:#16a34a;}
  .tag.orange{background:#ffedd5; color:#ea580c;}
  .tag.fast{background:#fee2e2; color:#dc2626;}
  .tag.medium{background:#dbeafe; color:#1a6aa0;}
  .tag.slow{background:#f1f5f9; color:#64748b;}
  .row{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:14px;}
  .row .field{display:flex; flex-direction:column; gap:5px;}
  .row .field label{font-size:13.5px; color:var(--txt2);}
  .btns{display:flex; gap:8px;}
  .cmt-line{font-size:14.5px; line-height:1.85;}
  .cmt-line .hl{color:#16689f; font-weight:700;}
  .cmt-chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .cmt-chip{background:#f3f9ff; border:1px solid #d9ecfb; color:var(--txt); border-radius:20px; padding:4px 12px; font-size:13.5px;}
  .cmt-chip.lead{background:#e0f0ff; border-color:var(--accent); color:#16689f; font-weight:600;}
  .tabs{display:flex; gap:6px; margin-bottom:16px; border-bottom:1px solid var(--line);}
  .set-tab{padding:10px 20px; cursor:pointer; font-size:15px; color:var(--txt2); border-bottom:2px solid transparent; border-radius:8px 8px 0 0; user-select:none; transition:.15s;}
  .set-tab:hover{background:#f0f8ff; color:var(--txt);}
  .set-tab.active{color:#16689f; border-bottom-color:var(--accent); font-weight:600; background:#eff8ff;}
  .muted{color:var(--txt2); font-size:13px; line-height:1.6;}
  .toast{position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#fff; border:1px solid var(--accent); color:var(--txt); padding:12px 20px; border-radius:8px; z-index:999; box-shadow:0 8px 30px rgba(0,0,0,.15); opacity:0; transition:.25s;}
  .toast.show{opacity:1;}
  .toast.err{border-color:var(--red);}
  .modal-bg{position:fixed; inset:0; background:rgba(15,23,42,.5); display:none; align-items:center; justify-content:center; z-index:500;}
  .modal-bg.show{display:flex;}
  .modal{background:#fff; border:1px solid var(--line); border-radius:10px; padding:22px; width:460px; max-width:92vw; max-height:88vh; overflow-y:auto;}
  .modal h3{margin-bottom:16px; display:flex; align-items:center; gap:8px;}
  .modal h3::before{content:""; width:4px; height:15px; background:var(--accent); border-radius:3px; display:inline-block;}
  .form-row{margin-bottom:12px;}
  .form-row label{display:block; font-size:13.5px; color:var(--txt2); margin-bottom:5px;}
  .form-row input,.form-row select{width:100%;}
  .modal-btns{display:flex; gap:10px; justify-content:flex-end; margin-top:8px;}
  .hidden{display:none !important;}
  input[type=checkbox].big{width:20px; height:20px; cursor:pointer; accent-color:var(--accent);}
  .pill{display:inline-block; padding:3px 10px; border-radius:6px; background:#f1f5f9; font-size:12px; margin:2px;}
  .preview-table{max-height:240px; overflow:auto; border:1px solid var(--line); border-radius:6px; margin-top:10px;}
  .preview-table table th,.preview-table table td{padding:5px 8px; font-size:12px;}
  .login-wrap{position:relative; min-height:100vh; background:linear-gradient(135deg,#0f2540 0%,#1e4d78 55%,#2f7fb5 100%); display:flex; align-items:center; justify-content:flex-end; padding:0 7%;}
  .login-logo{position:absolute; top:26px; left:36px; height:92px; filter:drop-shadow(0 1px 4px rgba(0,0,0,.35));}
  .login-slogan{position:absolute; left:5%; top:36%; color:#223042; font-family:"KaiTi","楷体","STKaiti",serif; font-size:36px; font-weight:700; line-height:2; letter-spacing:3px; text-shadow:0 1px 8px rgba(255,255,255,.6); pointer-events:none;}
  .login-card{position:relative; width:340px; background:rgba(255,255,255,.97); border-radius:10px; box-shadow:0 10px 36px rgba(10,30,60,.30); padding:30px 30px 22px; margin-right:1%;}
  .login-card h1{font-size:20px; margin-bottom:20px; color:#1f2d3d; letter-spacing:2px;}
  .login-card label{color:#556; font-size:13px;}
  .login-card input{background:#f5f7fa; color:#222; border:1px solid #d9dee5; width:100%; font-size:14px; padding:8px 10px;}
  .login-card input:focus{border-color:#2f7bf6; background:#fff;}
  .login-card .form-row{margin-bottom:14px;}
  .login-card .err{color:#d93025;}
  .login-card .btn{background:#2f7bf6; color:#fff; font-weight:400; width:100%; padding:10px; font-size:15px; letter-spacing:4px; margin-top:4px;}
  .login-card .btn:hover{background:#1f66d6;}
  .login-card .mode-link{margin-top:14px; text-align:center; font-size:13px; color:#67788c;}
  .login-card .mode-link a{color:#2f7bf6; cursor:pointer; text-decoration:none;}
  .login-card .mode-link a:hover{text-decoration:underline;}
  .login-card .muted{color:#8a97a5;}
  .login-footer{position:absolute; bottom:16px; left:0; width:100%; text-align:center; color:rgba(35,55,85,.8); font-size:13px; letter-spacing:2px; text-shadow:0 1px 4px rgba(255,255,255,.5); pointer-events:none;}
  .err{color:#dc2626; font-size:12px; margin-top:6px; min-height:14px;}
  .flex-between{display:flex; justify-content:space-between; align-items:center;}
  .stat-box{display:flex; gap:18px; flex-wrap:wrap; margin-top:10px;}
  .stat-box .s{background:#f1f5f9; border-radius:8px; padding:12px 16px; min-width:120px;}
  .stat-box .s .v{font-size:22px; font-weight:700;}
  .stat-box .s .k{font-size:12px; color:var(--txt2);}
  .low-list{max-height:320px; overflow:auto;}
  canvas{max-width:100%;}
  .insight{line-height:1.9;}
  .insight .hl{color:#1a6aa0; font-weight:600;}
  .insight .hot{color:#dc2626; font-weight:600;}
  .insight .ok{color:#16a34a; font-weight:600;}
  /* 可搜索物料选择器 */
  .mp-wrap{position:relative; flex:1; min-width:300px;}
  .mp-input{width:100%;}
  .mp-dd{position:absolute; left:0; top:100%; margin-top:2px; min-width:100%; width:max-content; max-width:520px; background:#fff; border:1px solid var(--line); border-radius:6px; box-shadow:0 8px 24px rgba(15,23,42,.14); max-height:300px; overflow:auto; z-index:50; display:none;}
  .mp-dd.show{display:block;}
  .mp-opt{display:flex; align-items:center; gap:10px; padding:9px 12px; cursor:pointer; font-size:14.5px; border-bottom:1px solid #f1f5f9;}
  .mp-opt:hover{background:#eff8ff;}
  .mp-opt .nm{flex:0 1 auto; min-width:0; max-width:230px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .mp-opt .c{color:var(--txt2); font-size:12.5px; white-space:nowrap;}
  .mp-opt .t{margin-left:auto; color:#16689f; font-size:12.5px; font-weight:600; white-space:nowrap;}
  .pager{display:inline-flex; gap:6px; align-items:center;}
</style>
</head>
<body>

<div id="demoBar" style="position:fixed;top:0;left:0;right:0;z-index:9999;background:#312e81;color:#fff;font:13px/1.6 'Microsoft YaHei',sans-serif;padding:7px 16px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.18)">
  <b>在线演示版</b>　数据为脱敏静态快照，可点击左侧菜单浏览全部功能页；新增 / 修改等写入操作在演示版中不生效。
  <a href="wms.html" style="color:#c7d2fe;text-decoration:underline;margin-left:8px">查看项目案例</a>
  <a href="index.html" style="color:#c7d2fe;text-decoration:underline;margin-left:8px">返回作品集</a>
</div>
<style>body{padding-top:34px!important}#app{min-height:calc(100vh - 34px)}</style>


<div id="login" class="login-wrap hidden">
  <div class="login-logo" style="font-size:30px;font-weight:800;color:#fff;letter-spacing:2px">WMS DEMO</div>
  <div class="login-slogan">物料 · 班组 · 流水 · 分析<br>车间仓储全流程演示</div>
  <div class="login-card">
    <h1 id="loginTitle">登录系统</h1>
    <div class="form-row">
      <label>用户名（工号）</label>
      <input id="loginUser" placeholder="请输入工号" autocomplete="username">
    </div>
    <div class="form-row" id="loginNameRow" style="display:none;">
      <label>姓名</label>
      <input id="loginName" placeholder="请输入姓名（可留空）">
    </div>
    <div class="form-row">
      <label>密码</label>
      <input id="loginPwd" type="password" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <div class="form-row" id="loginPwd2Row" style="display:none;">
      <label>确认密码</label>
      <input id="loginPwd2" type="password" placeholder="请再次输入密码">
    </div>
    <div class="err" id="loginErr"></div>
    <button class="btn" id="loginBtn">登 录</button>
    <div class="mode-link" id="modeLink"><a id="switchMode">没有账号？立即注册</a></div>
    <p class="muted" id="initTip" style="margin-top:10px; text-align:center;"></p>
  </div>
  <div class="login-footer">作品集演示版 · 数据均为脱敏演示数据</div>
</div>

<div id="app" class="hidden">
  <div id="sidebar">
    <div class="logo">
      <div class="sidebar-logo"><span>生产部仓管 · DEMO</span></div>
      <small id="storeNameMini">作品集演示版</small>
      <span class="ver">v2.1 演示版</span>
    </div>
    <div id="nav"></div>
    <div class="foot" id="navFoot"></div>
  </div>
  <div id="main">
    <div id="topbar">
      <h2 id="pageTitle">总览</h2>
      <div class="user">
        <span id="userInfo"></span>
        <button class="btn sub sm" id="changePwdBtn">改密码</button>
        <button class="btn sub sm" id="logoutBtn">退出</button>
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>

<div id="modalBg" class="modal-bg"><div class="modal" id="modalBox"></div></div>
<div id="toast" class="toast"></div>

<script>
var API='/api/';
var ME=null;
var NAV=[
  {id:'dashboard', label:'总览', icon:'▣'},
  {id:'materials', label:'物料管理', icon:'▤'},
  {id:'pick', label:'领用/归还', icon:'⇄'},
  {id:'branchops', label:'补货/班组', icon:'▦'},
  {id:'records', label:'领用/操作记录', icon:'☰'},
  {id:'analysis', label:'数据分析', icon:'◫'},
  {id:'settings', label:'系统设置', icon:'⚙'}
];

if(window.Chart){ try{ Chart.defaults.color='#64748b'; Chart.defaults.borderColor='rgba(226,232,240,.9)'; Chart.defaults.font.family='Microsoft YaHei, -apple-system, sans-serif'; }catch(e){} }
var anCharts={};
function destroyAnCharts(){ for(var k in anCharts){ if(anCharts[k]){ try{anCharts[k].destroy();}catch(e){} } } anCharts={}; }
function renderChart(id, config){
  var el=document.getElementById(id); if(!el) return;
  if(anCharts[id]){ try{anCharts[id].destroy();}catch(e){} }
  anCharts[id]=new Chart(el, config);
}

function api(path, opts){
  opts=opts||{};
  var v = MOCK[path];
  if(v===undefined){
    var ks=Object.keys(MOCK), base=path.split('?')[0];
    for(var i=0;i<ks.length;i++){
      if(ks[i]===base || ks[i].split('?')[0]===base){ v=MOCK[ks[i]]; break; }
    }
  }
  if(v===undefined) v={ok:true,msg:'演示版为静态快照，写入操作未启用'};
  return Promise.resolve(JSON.parse(JSON.stringify(v)));
}
function toast(msg, isErr){
  var t=document.getElementById('toast');
  t.textContent=msg; t.className='toast show'+(isErr?' err':'');
  setTimeout(function(){ t.className='toast'+(isErr?' err':''); }, 2600);
}
function fmt(n){ n=Number(n)||0; return n; }
function esc(s){ s=s===null||s===undefined?'':String(s); return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

// ---------- 登录 / 注册 ----------
var LOGIN_MODE='login';
function setLoginMode(m){
  LOGIN_MODE=m;
  var isReg=(m!=='login');
  document.getElementById('loginTitle').textContent = m==='init' ? '首次初始化' : (m==='register' ? '注册账号' : '登录系统');
  document.getElementById('loginNameRow').style.display = isReg? '' : 'none';
  document.getElementById('loginPwd2Row').style.display = isReg? '' : 'none';
  document.getElementById('loginBtn').textContent = m==='init' ? '创建管理员并进入' : (m==='register' ? '注 册' : '登 录');
  document.getElementById('switchMode').textContent = isReg? '已有账号？返回登录' : '没有账号？立即注册';
  document.getElementById('modeLink').style.display = m==='init' ? 'none' : '';
  document.getElementById('initTip').textContent = m==='init' ? '首次使用：注册的第一个账号自动成为管理员' : '';
  document.getElementById('loginErr').textContent='';
}
function showLogin(mode){
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
  setLoginMode(mode||'login');
}
function doLogin(){
  var u=document.getElementById('loginUser').value.trim();
  var p=document.getElementById('loginPwd').value;
  if(!u||!p){ document.getElementById('loginErr').textContent='请输入工号和密码'; return; }
  api('login',{method:'POST',body:{username:u,password:p}}).then(function(r){
    if(r.ok){ afterLogin(); }
    else document.getElementById('loginErr').textContent=r.msg;
  });
}
function doRegister(){
  var u=document.getElementById('loginUser').value.trim();
  var p=document.getElementById('loginPwd').value;
  var p2=document.getElementById('loginPwd2').value;
  var name=document.getElementById('loginName').value.trim();
  if(!u||!p){ document.getElementById('loginErr').textContent='请输入工号和密码'; return; }
  if(p!==p2){ document.getElementById('loginErr').textContent='两次输入的密码不一致'; return; }
  api('register',{method:'POST',body:{username:u,password:p,name:name}}).then(function(r){
    if(r.ok){ afterLogin(); }
    else document.getElementById('loginErr').textContent=r.msg;
  });
}
function afterLogin(){
  api('me').then(function(r){
    if(!r.ok){ showLogin(false); return; }
    ME=r.user;
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    buildNav();
    go('dashboard');
  });
}
function buildNav(){
  var nav=document.getElementById('nav'); nav.innerHTML='';
  NAV.forEach(function(n){
    if(n.admin && ME.role!=='admin') return;
    var d=document.createElement('div');
    d.className='navitem'; d.dataset.id=n.id;
    d.innerHTML='<span class="ic">'+n.icon+'</span><span>'+n.label+'</span>';
    d.onclick=function(){ go(n.id); };
    nav.appendChild(d);
  });
  document.getElementById('userInfo').textContent='工号 '+ME.username+(ME.role==='admin'?'（管理员）':'');
  document.getElementById('navFoot').textContent='当前登录: '+ME.name;
  api('config').then(function(r){ if(r.ok) document.getElementById('storeNameMini').textContent=r.config.storeName||'Win7 内网版'; });
}
function go(page){
  // 旧页面 id 兼容（合并后仍支持旧链接跳转）
  if(page==='import'){ window.__setTab='io'; page='settings'; }
  else if(page==='users'){ window.__setTab='users'; page='settings'; }
  else if(page==='branches'||page==='replenish'){ page='branchops'; }
  else if(page==='withdraw'||page==='return'){ page='pick'; }
  destroyAnCharts();
  document.querySelectorAll('.navitem').forEach(function(e){ e.classList.toggle('active', e.dataset.id===page); });
  var meta=NAV.filter(function(n){return n.id===page;})[0];
  document.getElementById('pageTitle').textContent=meta?meta.label:page;
  var c=document.getElementById('content');
  if(page==='dashboard') renderDashboard(c);
  else if(page==='materials') renderMaterials(c);
  else if(page==='pick') renderPick(c);
  else if(page==='branchops') renderBranchOps(c);
  else if(page==='records') renderRecords(c);
  else if(page==='analysis') renderAnalysis(c);
  else if(page==='settings') renderSettings(c);
}

// ---------- 总览 ----------
function renderDashboard(c){
  c.innerHTML=
    '<div class="grid-cards" id="kpis"></div>'+

// 近期各班组热门物料用量对比（分组柱状图：横轴为热门物料，每个班组一组）+ 点评
function renderBranchHot(BH, canvasId, cmtId){
  canvasId = canvasId || 'branchHotChart';
  if(!BH || !BH.hot || !BH.hot.length){ return; }
  renderBranchHotComment(BH, cmtId || 'branchHotCmt');
  var colors=['#5aa9e6','#7dbdf0','#a9d7f3','#3f8fc9','#8ec5f0','#c3e2f7'];
  var labels=BH.hot.map(function(x){return x.name;});
  var datasets=BH.branches.map(function(b,i){
    return {
      label:b.name,
      data:BH.hot.map(function(x){return x.branches[b.id]||0;}),
      backgroundColor:colors[i%colors.length],
      borderRadius:4
    };
  });
  renderChart(canvasId,{
    type:'bar',
    data:{ labels:labels, datasets:datasets },
    options:{ responsive:true, plugins:{legend:{position:'top'}}, scales:{x:{grid:{display:false}}, y:{beginAtZero:true, grid:{color:'rgba(226,232,240,.9)'}}} }
  });
}
// 点评：统计「使用量前 5 的物料」在各班组的领用合计，指出用量最多的班组并给建议
function renderBranchHotComment(BH, boxId){
  var box=document.getElementById(boxId);
  if(!box) return;
  if(!BH || !BH.hot || !BH.hot.length || !BH.branches || !BH.branches.length){
    box.innerHTML='<span class="muted">近周期内暂无领用数据，无法生成点评。</span>'; return;
  }
  var rows=BH.branches.map(function(b){
    var sum=0;
    BH.hot.forEach(function(h){ sum += (h.branches[b.id]||0); });
    return { id:b.id, name:b.name, sum:sum };
  });
  rows.sort(function(a,b){ return b.sum-a.sum; });
  var total=0; rows.forEach(function(r){ total+=r.sum; });
  if(!total){ box.innerHTML='<span class="muted">近周期内暂无领用数据，无法生成点评。</span>'; return; }
  var top1=rows[0], last=rows[rows.length-1];
  var share=top1.sum/total*100;
  var pct = last.sum>0 ? (top1.sum/last.sum-1)*100 : null;
  var balanced = pct!==null && pct < 10;
  var gapTxt = '';
  if(balanced) gapTxt='，四个班组差距在 10% 以内、用量基本均衡';
  else if(pct!==null) gapTxt='，比用量最低的「'+esc(last.name)+'」高 '+pct.toFixed(1)+'%';
  var advice = balanced
    ? '建议：各班组周转压力接近，可维持现有补货节奏，重点保证这 '+BH.hot.length+' 种高频物料在每个班组都有安全库存。'
    : '建议：优先保障「'+esc(top1.name)+'」的补货节奏与安全库存，其周转压力最大；'+
      (rows.length>1?'「'+esc(last.name)+'」用量最少（'+fmt(last.sum)+' 件），可适当压低常备库存，减少呆滞。':'');
  var chips=rows.map(function(r,i){
    return '<span class="cmt-chip'+(i===0?' lead':'')+'">'+(i+1)+'. '+esc(r.name)+' <b>'+fmt(r.sum)+'</b> ('+(r.sum/total*100).toFixed(1)+'%)</span>';
  }).join('');
  box.innerHTML=
    '<div class="cmt-line">点评：近 '+BH.days+' 天使用量前 '+BH.hot.length+' 的物料中，'+
      '物料使用量最多的班组是 <span class="hl">'+esc(top1.name)+'</span>，合计 <span class="hl">'+fmt(top1.sum)+'</span> 件，'+
      '占这几个热门物料总用量的 <span class="hl">'+share.toFixed(1)+'%</span>'+gapTxt+'。</div>'+
    '<div class="cmt-line muted">'+advice+'</div>'+
    '<div class="cmt-chips">'+chips+'</div>';
}

function renderInsight(S,U,R,T,urgentTotal){
  var box=document.getElementById('insightBox');
  var top1 = U.length? U[0] : null;
  var fast = U.filter(function(x){return x.tier==='fast';}).map(function(x){return x.name;}).slice(0,3);
  // 明细表只取 Top 200，故「未被领用」与「紧急」数量改用服务端汇总值，避免统计偏差
  var slow = (S.unusedInPeriod!==undefined&&S.unusedInPeriod!==null)? S.unusedInPeriod : U.filter(function(x){return x.tier==='slow';}).length;
  var urgent = (urgentTotal!==null&&urgentTotal!==undefined)? urgentTotal : R.filter(function(x){return x.urgency==='urgent';}).length;
  var soon = R.filter(function(x){return x.urgency==='soon';}).length;
  // 近7天 vs 前7天
  var n=T.length;
  var last7=T.slice(Math.max(0,n-7)); var prev7=T.slice(Math.max(0,n-14),Math.max(0,n-7));
  var sum=function(arr,f){ return arr.reduce(function(s,x){return s+f(x);},0); };
  var w1=sum(last7,function(x){return x.withdraw;}), w0=sum(prev7,function(x){return x.withdraw;});
  var change = (w0>0)? Math.round((w1-w0)/w0*100) : (w1>0?100:0);
  var chgTxt = change>0? ('<span class="hot">环比上升 '+change+'%</span>') : (change<0? ('<span class="ok">环比下降 '+Math.abs(change)+'%</span>') : '基本持平');
  var html='';
  html+='<p>· 近 <span class="hl">'+S.days+' 天</span>共发生领用 <span class="hl">'+S.periodWithdraw+' 次</span>，涉及 <span class="hl">'+S.materialUsed+'</span> 种物料，总库存量 <span class="hl">'+fmt(S.totalStock)+'</span>。</p>';
  if(top1) html+='<p>· 使用最频繁的物料为 <span class="hot">'+esc(top1.name)+'</span>（领用 '+top1.withdrawCount+' 次，合计 '+fmt(top1.withdrawQty)+'），建议作为保障供货的重点物料。</p>';
  html+='<p>· 当前待补货物料 <span class="hot">'+S.lowStock+' 种</span>；其中<span class="hot">紧急 '+urgent+' 种</span>、建议补货 '+soon+' 种，详见上方「智能补货建议」。</p>';
  if(fast.length) html+='<p>· 高周转（快流）物料：'+fast.map(function(x){return '<span class="hl">'+esc(x)+'</span>';}).join('、')+'，应提高安全库存并缩短补货周期。</p>';
  html+='<p>· 近 7 天领用次数 '+w1+'，较前 7 天（'+w0+'）'+chgTxt+'。</p>';
  html+='<p>· 周期内 <span class="hl">'+slow+' 种</span>物料未被领用，建议结合盘点评估是否为呆滞料。</p>';
  box.innerHTML=html;
}

function onMatSearch(){
  matKw=document.getElementById('matSearch').value.trim();
  matPage=1;
  loadMaterials();
}
// 服务端分页：海量物料下只取当前页，避免浏览器卡死
function loadMaterials(){
  api('materials?q='+encodeURIComponent(matKw)+'&page='+matPage+'&size=50').then(function(r){
    if(!r.ok){ toast(r.msg,true); return; }
    materialCache=r.materials;
    drawMaterials();
    var pg=document.getElementById('matPager');
    if(!pg) return;
    var pages=Math.max(1, Math.ceil(r.total/r.size));
    if(r.page>pages){ matPage=pages; loadMaterials(); return; }
    pg.innerHTML='共 '+r.total+' 种物料 · 第 '+r.page+' / '+pages+' 页 '+
      '<button class="btn sub sm" '+(r.page<=1?'disabled':'')+' onclick="matGo(-1)">上一页</button>'+
      '<button class="btn sub sm" '+(r.page>=pages?'disabled':'')+' onclick="matGo(1)">下一页</button>';
  });
}
function matGo(d){ matPage+=d; if(matPage<1) matPage=1; loadMaterials(); }
function drawMaterials(){
  var tb=document.getElementById('matBody');
  if(!materialCache.length){ tb.innerHTML='<tr><td colspan="12" class="muted" style="text-align:center;padding:20px">暂无物料</td></tr>'; return; }
  tb.innerHTML=materialCache.map(function(m){
    var th=(m.warnThreshold!==null&&m.warnThreshold!==undefined)?m.warnThreshold:null;
    var low = m.total<=th;
    return '<tr>'+
      '<td><input type="checkbox" class="big" data-id="'+m.id+'" onchange="updateSelCount()"></td>'+
      '<td>'+esc(m.code)+'</td><td>'+esc(m.category)+'</td><td>'+esc(m.name)+'</td><td>'+esc(m.spec)+'</td>'+
      '<td>'+esc(m.unit)+'</td><td>'+esc(m.bigClassCode)+'</td>'+
      '<td><b>'+fmt(m.total)+'</b></td><td>'+fmt(m.stock)+'</td>'+
      '<td>'+(th===null?'<span class="muted">默认</span>':th)+'</td>'+
      '<td>'+(low?'<span class="tag red">待补货</span>':'<span class="tag green">正常</span>')+'</td>'+
      '<td>'+
        '<button class="btn sub sm" onclick="openMaterialModal(\''+m.id+'\')">编辑</button> '+
        '<button class="btn sub sm" onclick="addStock(\''+m.id+'\')">追加</button> '+
        (ME.role==='admin'?'<button class="btn danger sm" onclick="deleteMaterial(\''+m.id+'\')">删</button>':'')+
      '</td></tr>';
  }).join('');
}

function batchDeleteMaterials(){
  var ids=Array.prototype.map.call(document.querySelectorAll('#matBody input[type=checkbox]:checked'), function(c){return c.dataset.id;});
  if(!ids.length) return;

var recPage=1;
function buildRecQuery(){
  var q=[];
  var t=document.getElementById('r_type').value; if(t) q.push('type='+encodeURIComponent(t));
  var b=document.getElementById('r_br').value.trim(); if(b) q.push('branch='+encodeURIComponent(b));
  var m=document.getElementById('r_mat').value.trim(); if(m) q.push('material='+encodeURIComponent(m));
  var w=document.getElementById('r_who').value.trim(); if(w) q.push('who='+encodeURIComponent(w));
  var sd=document.getElementById('r_sd').value; if(sd) q.push('startDate='+encodeURIComponent(sd));
  var ed=document.getElementById('r_ed').value; if(ed) q.push('endDate='+encodeURIComponent(ed));
  return q.join('&');
}
// 服务端分页：只取当前页，避免数万条记录一次性渲染
function loadRecords(){
  var q0=buildRecQuery();
  var q=q0+(q0?'&':'')+'page='+recPage+'&size=50';
  api('records?'+q).then(function(r){
    if(!r.ok){ toast(r.msg,true); return; }
    var tb=document.getElementById('recBody');
    if(!r.records.length){ tb.innerHTML='<tr><td colspan="8" class="muted" style="text-align:center;padding:20px">无记录</td></tr>'; }
    else {
      tb.innerHTML=r.records.map(function(x){
        var tp=x.type==='withdraw'?'<span class="tag">领用</span>':(x.type==='return'?'<span class="tag green">归还</span>':'<span class="tag">补货</span>');
        return '<tr><td>'+esc(x.time)+'</td><td>'+tp+'</td><td>'+esc(x.materialCode)+'</td><td>'+esc(x.materialName)+'</td><td>'+esc(x.branchName)+'</td><td>'+fmt(x.qty)+'</td><td>'+esc(x.whoName||x.who)+'</td><td>'+esc(x.orderNo)+'</td></tr>';
      }).join('');
    }
    var pg=document.getElementById('recPager');
    if(!pg) return;
    var pages=Math.max(1, Math.ceil(r.total/r.size));
    if(r.page>pages){ recPage=pages; loadRecords(); return; }
    pg.innerHTML='共 '+r.total+' 条记录 · 第 '+r.page+' / '+pages+' 页 '+
      '<button class="btn sub sm" '+(r.page<=1?'disabled':'')+' onclick="recGo(-1)">上一页</button>'+
      '<button class="btn sub sm" '+(r.page>=pages?'disabled':'')+' onclick="recGo(1)">下一页</button>';
  });
}
function recGo(d){ recPage+=d; if(recPage<1) recPage=1; loadRecords(); }
// size=0 = 服务端不分页，取全部匹配记录（用于导出/统计）
function getFilteredRecords(cb){
  var q0=buildRecQuery();
  api('records?'+q0+(q0?'&':'')+'size=0').then(function(r){ cb(r.ok?r.records:[]); });
}
function exportRecordsCSV(){
  window.location.href=API+'export/records/csv';
}
function exportRecordsExcel(){
  getFilteredRecords(function(recs){
    if(!recs.length){ toast('无数据',true); return; }
    if(recs.length>20000){ toast('匹配记录过多（'+recs.length+' 条），请改用「导出CSV」',true); return; }
    var data=[['时间','类型','物料代码','物料名称','班组','数量','领用人','工单号']];
    recs.forEach(function(x){
      data.push([x.time, x.type==='withdraw'?'领用':(x.type==='return'?'归还':'补货'), x.materialCode, x.materialName, x.branchName, x.qty, x.whoName||x.who, x.orderNo]);
    });
    downloadExcel(data,'领用记录_'+ts()+'.xlsx');
  });
}

// ---------- 文件解析 ----------
function readFileToGrid(file, cb){
  var name=(file.name||'').toLowerCase();
  if(name.endsWith('.csv')){
    var reader=new FileReader();
    reader.onload=function(){
      var buf=new Uint8Array(reader.result);
      var text=decodeBytes(buf);
      cb(parseCsvText(text));
    };
    reader.readAsArrayBuffer(file);
  } else {
    var reader2=new FileReader();
    reader2.onload=function(){
      try{
        var wb=XLSX.read(new Uint8Array(reader2.result),{type:'array'});
        var ws=wb.Sheets[wb.SheetNames[0]];
        var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        cb(rows);
      }catch(e){ cb(null); }
    };
    reader2.readAsArrayBuffer(file);
  }
}
function decodeBytes(buf){
  if(buf.length>=3 && buf[0]===0xEF && buf[1]===0xBB && buf[2]===0xBF) return new TextDecoder('utf-8').decode(buf.slice(3));
  try{ return new TextDecoder('utf-8',{fatal:true}).decode(buf); }
  catch(e){ try{ return new TextDecoder('gbk').decode(buf); }catch(e2){ return new TextDecoder('utf-8').decode(buf); } }
}
function parseCsvText(text){
  var rows=[]; var i=0; var row=[]; var cur=''; var inq=false;
  text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  while(i<text.length){
    var ch=text[i];
    if(inq){
      if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i+=2; continue; } inq=false; i++; continue; }
      cur+=ch; i++; continue;
    }
    if(ch==='"'){ inq=true; i++; continue; }
    if(ch===','){ row.push(cur); cur=''; i++; continue; }
    if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; i++; continue; }
    cur+=ch; i++;
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function downloadExcel(rows, filename){
  if(typeof XLSX==='undefined'){ toast('Excel 库未加载',true); return; }
  var ws=XLSX.utils.aoa_to_sheet(rows);
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
  XLSX.writeFile(wb, filename);
}
function ts(){ var d=new Date(); var p=function(n){return (n<10?'0':'')+n;}; return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes()); }

// 可搜索物料选择器：海量物料下不再一次性灌入 <select>，改为关键字服务端检索（/api/materials/search）
// opts: {wrapId, hiddenId, initialId, onPick, branchSel}
// 若指定 branchSel：先选班组，物料下拉默认列出「该班组现有物料（按数量降序）」；输入关键字则在班组内筛选
function attachMaterialPicker(opts){
  var wrap=document.getElementById(opts.wrapId);
  var hid=document.getElementById(opts.hiddenId);
  if(!wrap||!hid) return;
  wrap.innerHTML='<input class="mp-input" placeholder="输入物料代码 / 名称 / 品类搜索…" autocomplete="off"><div class="mp-dd"></div>';
  var input=wrap.querySelector('.mp-input');
  var dd=wrap.querySelector('.mp-dd');
  var timer=null;
  function hide(){ dd.classList.remove('show'); }
  function branchId(){ if(!opts.branchSel){ return ''; } var s=document.getElementById(opts.branchSel); return s? s.value : ''; }
  function showList(list){
    if(!list.length){ dd.innerHTML='<div class="mp-opt muted">'+(branchId()?'该班组暂无可选物料':'无匹配物料')+'</div>'; dd.classList.add('show'); return; }
    dd.innerHTML=list.map(function(m){
      var qty=(m.qty!==undefined? m.qty : m.total);
      return '<div class="mp-opt" data-id="'+m.id+'" data-label="'+esc((m.code?m.code+' ':'')+m.name)+'">'+
        '<span class="nm">'+esc(m.name)+'</span>'+
        '<span class="c">'+esc(m.code)+(m.category?' · '+esc(m.category):'')+'</span>'+
        '<span class="t">库存 '+fmt(qty)+'</span></div>';
    }).join('');
    dd.classList.add('show');
  }
  function load(kw){
    var bid=branchId();
    var p = bid
      ? api('branch-materials?branchId='+encodeURIComponent(bid)+'&q='+encodeURIComponent(kw||'')+'&size=150')
      : api('materials/search?q='+encodeURIComponent(kw||''));
    p.then(function(r){ if(!r.ok){ return; } showList(r.materials||[]); });
  }
  // 聚焦且未选中时，直接展示（班组的）物料清单
  input.addEventListener('focus', function(){ if(!hid.value){ load(input.value.trim()); } });
  input.addEventListener('input', function(){
    hid.value='';
    if(timer) clearTimeout(timer);
    timer=setTimeout(function(){ load(input.value.trim()); }, 200);
  });
  dd.addEventListener('mousedown', function(e){ e.preventDefault(); });
  dd.addEventListener('click', function(e){
    var opt=e.target;
    while(opt && opt!==dd && String(opt.className).indexOf('mp-opt')===-1) opt=opt.parentNode;
    if(!opt||opt===dd) return;
    var id=opt.getAttribute('data-id');
    if(!id) return;
    hid.value=id;
    input.value=opt.getAttribute('data-label')||'';
    hide();
    if(opts.onPick) opts.onPick();
  });
  input.addEventListener('blur', function(){ setTimeout(hide,150); });
  if(opts.branchSel){
    var bs=document.getElementById(opts.branchSel);
    if(bs){ bs.addEventListener('change', function(){ hid.value=''; input.value=''; hide(); if(opts.onPick) opts.onPick(); }); }
  }
  if(opts.initialId){
    hid.value=opts.initialId;
    api('materials/'+opts.initialId).then(function(r){
      if(r.ok){ var m=r.material; input.value=(m.code?m.code+' ':'')+m.name; }
    });
  }
}
